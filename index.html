<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>
try{document.documentElement.dataset.theme=localStorage.getItem('bms-theme')||'neon';}catch(e){}
</script>
<title>Stock Lot Formatter — จัดรูปแบบสต็อกตาม LOT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="styles/variables.css">
<link rel="stylesheet" href="styles/base.css">
<link rel="stylesheet" href="styles/layout.css">
<link rel="stylesheet" href="src/components/stepper/stepper.css">
<link rel="stylesheet" href="src/components/modal/modal.css">
<link rel="stylesheet" href="src/components/toast/toast.css">
<link rel="stylesheet" href="src/components/loading/loading.css">
<link rel="stylesheet" href="src/components/table/table.css">
<link rel="stylesheet" href="src/components/form/form.css">
<link rel="stylesheet" href="src/modules/stock-count/stock-count.css">
<link rel="stylesheet" href="src/modules/stock-count/stock-count-auth.css">
<link rel="stylesheet" href="src/modules/dashboard/dashboard.css">
<link rel="stylesheet" href="src/modules/duplicate-check/duplicate-check.css">
<link rel="stylesheet" href="src/modules/super-admin/super-admin.css">
<link rel="stylesheet" href="styles/responsive.css">
</head>
<body>
<div id="globalAuthRoot"></div>
<div id="app" hidden>
  <div class="app-shell">
    <aside class="app-nav" aria-label="เมนูหลัก">
      <div class="app-nav-brand">
        <div class="brand-mark"></div>
        <span class="app-nav-title">BMS Inventory</span>
        <button class="app-nav-collapse" id="appNavCollapse" type="button" aria-label="ย่อแถบเมนู" aria-expanded="true" title="ย่อแถบเมนู">⇤</button>
      </div>
      <nav class="app-nav-list">
        <button class="app-nav-item" data-module="dashboard" type="button">
          <span class="app-nav-icon">▦</span>
          <span class="app-nav-label">Dashboard</span>
        </button>
        <button class="app-nav-item active" data-module="stock-count" type="button">
          <span class="app-nav-icon">🔢</span>
          <span class="app-nav-label">นับสต็อก</span>
        </button>
        <button class="app-nav-item" data-module="lot-formatter" type="button">
          <span class="app-nav-icon">📦</span>
          <span class="app-nav-label">จัดสต็อกตาม LOT</span>
        </button>
        <button class="app-nav-item" data-module="duplicate-check" type="button">
          <span class="app-nav-icon">🔎</span>
          <span class="app-nav-label">ตรวจสอบรายการซ้ำ</span>
        </button>
        <button class="app-nav-item" data-module="super-admin" type="button" hidden>
          <span class="app-nav-icon">⚙️</span>
          <span class="app-nav-label">จัดการข้อมูลพื้นฐาน</span>
        </button>
      </nav>
      <div class="app-account" id="appAccount" hidden></div>
    </aside>

    <div class="app-main">
      <div class="topbar">
        <div class="brand">
          <div>
            <h1 id="moduleTitle">Mobile Stock Count</h1>
            <p id="moduleSubtitle">เดินนับยาในห้องจ่ายยาด้วยมือถือหรือ iPad — รองรับหลาย Package, LOT และ EXP</p>
          </div>
        </div>
        <div class="topbar-actions">
          <label class="theme-picker" title="เปลี่ยนสีธีม">
            <span class="theme-picker-icon" aria-hidden="true">◐</span>
            <span class="theme-picker-label">ธีม</span>
            <select id="themeSelect" aria-label="เปลี่ยนสีธีม">
              <option value="neon">Neon</option>
              <option value="ocean">Ocean</option>
              <option value="sunset">Sunset</option>
              <option value="light">Light</option>
            </select>
          </label>
        </div>
      </div>

      <div class="module-panel" data-module-panel="lot-formatter" hidden>
        <div class="app-workspace">
          <aside class="wizard-sidebar" aria-label="ขั้นตอนการทำงาน">
            <div class="stepper" id="stepper"></div>
          </aside>
          <main class="wizard-main">
            <button class="btn btn-danger card-reset-btn" id="btnReset">เริ่มใหม่</button>
            <div id="stepContent"></div>
            <div class="footer-nav">
              <button class="btn" id="btnBack">← ย้อนกลับ</button>
              <div class="right">
                <button class="btn btn-primary" id="btnNext">ถัดไป →</button>
              </div>
            </div>
          </main>
        </div>
      </div>

      <div class="module-panel" data-module-panel="stock-count">
        <div id="stockCountRoot"></div>
      </div>

      <div class="module-panel" data-module-panel="dashboard" hidden>
        <div id="dashboardRoot"></div>
      </div>

      <div class="module-panel" data-module-panel="duplicate-check" hidden>
        <div id="duplicateCheckRoot"></div>
      </div>

      <div class="module-panel" data-module-panel="super-admin" hidden>
        <div id="superAdminRoot"></div>
      </div>
    </div>
  </div>
</div>

<div id="modalRoot"></div>
<div id="toasts"></div>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>

<!-- config -->
<script src="src/config/fields.config.js"></script>
<script src="src/config/app.config.js"></script>
<script src="src/config/supabase.config.js"></script>

<!-- state -->
<script src="src/state/store.js"></script>

<!-- utils -->
<script src="src/utils/string.util.js"></script>
<script src="src/utils/number.util.js"></script>
<script src="src/utils/date.util.js"></script>
<script src="src/utils/mapping.util.js"></script>

<!-- services -->
<script src="src/services/excel-import.service.js"></script>
<script src="src/services/excel-export.service.js"></script>
<script src="src/services/stock-count-sync.service.js"></script>
<script src="src/services/auth.service.js"></script>

<!-- components -->
<script src="src/components/toast/toast.js"></script>
<script src="src/components/modal/modal.js"></script>
<script src="src/components/loading/loading.js"></script>
<script src="src/components/stepper/stepper.js"></script>

<!-- core business logic -->
<script src="src/core/validation.logic.js"></script>
<script src="src/core/grouping.js"></script>

<!-- wizard step pages -->
<script src="src/modules/upload/upload.page.js"></script>
<script src="src/modules/sheet-select/sheet-select.page.js"></script>
<script src="src/modules/mapping/mapping.page.js"></script>
<script src="src/modules/settings/settings.page.js"></script>
<script src="src/modules/validation/validation.page.js"></script>
<script src="src/modules/preview/preview.page.js"></script>
<script src="src/modules/export/export.page.js"></script>

<!-- other top-level menus -->
<script src="src/modules/stock-count/stock-count.page.js"></script>
<script src="src/modules/dashboard/dashboard.page.js"></script>
<script src="src/modules/duplicate-check/duplicate-check.page.js"></script>
<script src="src/modules/super-admin/super-admin.page.js"></script>

<!-- wizard router + boot -->
<script src="src/wizard-router.js"></script>
<script src="src/app.js"></script>
<script src="src/app-shell.js"></script>
</body>
</html>
